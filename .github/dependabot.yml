# Dependabot nur für GitHub Actions: Weitere Abhängigkeiten hat macvm nicht (eine Swift-Datei, nur
# Apple-Frameworks). Die Actions sind per Commit-SHA gepinnt; Dependabot hebt SHA und Versionskommentar
# gemeinsam an. Wartezeit 7 Tage wie minimumReleaseAge im gemeinsamen Renovate-Preset.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 7
